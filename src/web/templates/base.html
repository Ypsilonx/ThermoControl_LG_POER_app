<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ThermoControl-LG-POER_app{% endblock %}</title>

    <!-- x-cloak: skryje nepřipravené elementy dokud Alpine.js neinicializuje -->
    <style>
        [x-cloak]{display:none!important}
        /* Skrytí scrollbaru – WebKit fallback pro případ pomalého načtení app.css */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>

    <!-- Tailwind CSS – Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: "#3b82f6", light: "#60a5fa", dark: "#2563eb" }
                    }
                }
            }
        }
    </script>

    <!-- Vlastní CSS doplňky (no-scrollbar aj.) -->
    <link rel="stylesheet" href="/static/css/app.css">

    <!-- Alpine.js – reaktivní UI bez build kroku -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    {% block head_extra %}{% endblock %}
</head>
<body class="bg-gray-900 min-h-screen text-gray-100">

    <!-- Navigační lišta -->
    <nav class="bg-gray-950 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-12 flex items-center justify-between">

            <!-- Logo -->
            <div class="flex items-center gap-2 text-white font-semibold select-none">
                <span class="text-lg">❄</span>
                <span>ThermoControl-LG-POER_app</span>
            </div>

            <!-- Odkazy -->
            <div class="flex items-center gap-4 text-xs text-gray-500">
                <a href="/" class="hover:text-gray-300 transition-colors"
                   :class="'{{ active_page }}' === 'dashboard' ? 'text-gray-200' : ''">Dashboard</a>
                <a href="/control" class="hover:text-gray-300 transition-colors"
                   :class="'{{ active_page }}' === 'control' ? 'text-gray-200' : ''">Řízení</a>
                <a href="/health" class="hover:text-gray-300 transition-colors">/health</a>
            </div>
        </div>
    </nav>

    <!-- Hlavní obsah stránky -->
    <main class="max-w-5xl mx-auto px-4 py-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Patička -->
    <footer class="mt-8 text-center text-xs text-gray-700 pb-4">
        ThermoControl-LG-POER_app
        &middot; <a href="/health" class="hover:text-gray-500 transition-colors">/health</a>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
